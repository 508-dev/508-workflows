version: 2
multi-ecosystem-groups:
  dependency-updates:
    schedule:
      interval: daily
    commit-message:
      prefix: ⬆
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependency-updates
    cooldown:
      default-days: 7
  # Python
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependency-updates
    cooldown:
      default-days: 7
  # Admin dashboard
  - package-ecosystem: bun
    directory: /apps/admin_dashboard
    patterns: ["*"]
    multi-ecosystem-group: dependency-updates
    cooldown:
      default-days: 7
