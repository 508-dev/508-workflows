version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
  # Python
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
  # Admin dashboard
  - package-ecosystem: bun
    directory: /apps/admin_dashboard
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
