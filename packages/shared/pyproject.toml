[project]
name = "five08"
version = "0.1.0"
description = "Shared settings, queue, and job utilities for 508.dev services"
requires-python = ">=3.12"
dependencies = [
    "cloakbrowser>=0.3.31",
    "cryptography>=46.0.0",
    "curl-cffi>=0.10.0",
    "pydantic~=2.13",
    "pydantic-settings~=2.14",
    "pymupdf>=1.26.5",
    "python-docx>=1.2.0",
    "psycopg[binary]>=3.3.4",
    "redis>=6.4.0",
    "requests~=2.34",
    "sentry-sdk>=2.30.0",
    # Exact-pin v4.6.1 while we wire the v4 observation-centric SDK surface.
    "langfuse==4.6.1",
]

[tool.pyrefly]
project-includes = ["src/five08"]
search-path = [
    "src",
    "../../apps/api/src",
    "../../apps/discord_bot/src",
    "../../apps/worker/src",
]
python-version = "3.12"
preset = "legacy"
ignore-missing-imports = [".*"]

[project.scripts]
crmctl = "five08.crm_cli:run"
agent-eval = "five08.agent.evals:main"
resume-eval = "five08.resume_evals:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/five08"]

[tool.hatch.build.targets.wheel.force-include]
"src/five08/data/model-profiles.json" = "five08/data/model-profiles.json"
"src/five08/llm_model_profiles.json" = "five08/llm_model_profiles.json"
