[project]
name = "api"
version = "0.1.0"
description = "Webhook ingest and dashboard API for 508.dev"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "PyJWT[crypto]>=2.10.1",
    "uvicorn>=0.35.0",
    "psycopg[binary]>=3.3.4",
    "redis>=6.4.0",
    "pydantic~=2.13",
    "pydantic-settings~=2.8",
    "five08",
    "worker",
]

[tool.uv.sources]
five08 = { workspace = true }
worker = { workspace = true }

[tool.pyrefly]
project-includes = ["src/five08"]
search-path = [
    "src",
    "../discord_bot/src",
    "../worker/src",
    "../../packages/shared/src",
]
python-version = "3.12"
preset = "legacy"
ignore-missing-imports = [".*"]

[project.scripts]
backend-api = "five08.backend.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/five08"]

[tool.hatch.build.targets.wheel.force-include]
"src/five08/backend/static" = "five08/backend/static"
