[project]
name = "discord_bot"
version = "0.1.0"
description = "Discord gateway service for 508.dev"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "discord.py~=2.6.0",
    "pydantic~=2.13",
    "pydantic-settings~=2.14",
    "python-docx>=1.2.0",
    "redis>=6.4.0",
    "openai>=2.0.0",
    "requests~=2.34",
    "five08",
]

[tool.uv.sources]
five08 = { workspace = true }

[tool.pyrefly]
project-includes = ["src/five08"]
search-path = [
    "src",
    "../api/src",
    "../worker/src",
    "../../packages/shared/src",
]
python-version = "3.12"
preset = "legacy"
ignore-missing-imports = [".*"]

[project.scripts]
discord-bot = "five08.discord_bot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/five08"]
