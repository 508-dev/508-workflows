[project]
name = "five08-monorepo"
version = "0.1.0"
description = "508.dev monorepo for Discord bot and job processing."
requires-python = ">=3.12"
dependencies = [
    "discord_bot",
    "api",
    "worker",
    "five08",
]

[tool.uv]
package = false
exclude-newer = "7 days"
exclude-newer-package = { cloakbrowser = "2026-06-01T16:00:00Z" }

[tool.uv.pip]
exclude-newer = "7 days"

[tool.uv.sources]
discord_bot = { workspace = true }
api = { workspace = true }
worker = { workspace = true }
five08 = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/discord_bot",
    "apps/api",
    "apps/worker",
    "packages/shared",
]

[dependency-groups]
dev = [
    "pytest~=9.0",
    "pytest-asyncio>=1.3,<1.5",
    "pytest-mock~=3.15",
    "coverage~=7.6",
    "ruff~=0.15.10",
    "watchfiles>=1.1.1",
    "types-requests>=2.33.0.20260408",
    "pre-commit>=3.7",
    "pre-commit-uv",
    "freezegun>=1.5.5",
    "playwright>=1.58.0",
    "pyrefly>=1.1.1",
]

[tool.pyrefly]
project-includes = [
    "apps/api/src/five08",
    "apps/discord_bot/src/five08",
    "apps/worker/src/five08",
    "packages/shared/src/five08",
]
search-path = [
    "apps/api/src",
    "apps/discord_bot/src",
    "apps/worker/src",
    "packages/shared/src",
]
python-version = "3.12"
preset = "legacy"
ignore-missing-imports = [".*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--tb=short --strict-markers"
markers = [
    "e2e: end-to-end tests requiring a live PostgreSQL connection",
    "playwright: browser-driven dashboard integration tests",
]

[tool.coverage.run]
source = ["five08"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
